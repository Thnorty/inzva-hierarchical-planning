# Diverges from upstream: the `docs` job was removed.
#
# It built upstream's mkdocs site and deployed it to GitHub Pages. We do not
# have Pages enabled and do not want upstream's documentation published under
# our repo, so it failed on every single push and mailed a failure notice each
# time. The `pages: write` and `id-token: write` permissions and the `pages`
# concurrency group went with it, since nothing else used them.
#
# The pre-commit and build jobs are kept as-is and are worth keeping: they are
# what confirmed our loader patch does not break upstream's test suite.
name: stable-worldmodel
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: pre-commit/action@v3.0.1

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: False
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
    - uses: actions/checkout@v5
    - name: System deps for MuJoCo/OpenGL
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libgl1-mesa-dev libgl1 libglx-mesa0 libglfw3 \
          libosmesa6-dev libegl1 libopengl0 patchelf
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Dependencies
      run: uv sync --all-extras
    - name: Tests
      run: uv run --group dev pytest
    - name: Build
      run: uv build
    - name: PyPi
      run: uv pip install stable-worldmodel
