output_model_name: pusht_decoder_probe_phase_a
subdir: runs/pusht_decoder_probe_phase_a
num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0
  log_every_n_steps: 10
  limit_train_batches: 1.0
  limit_val_batches: 1.0
loader:
  batch_size: 128
  num_workers: ${num_workers}
  persistent_workers: true
  prefetch_factor: 3
  pin_memory: true
optimizer:
  type: AdamW
  lr: 0.0002
  weight_decay: 0.0001
wandb:
  enabled: false
  image_log_interval: 1
  config:
    entity: null
    project: hi_decoder_probe
    name: ${output_model_name}
    id: pusht_decoder_probe_phase_a
    resume: never
    log_model: false
wm:
  history_size: 3
  high_level:
    waypoints:
      num: 5
      strategy: random_sorted
      min_stride: 1
      max_span: 15
      stride: -1
      beta_alpha: 2.0
      beta_beta: 2.0
  action_dim: 2
probe:
  mode: true_only
  checkpoint:
    path: data/stablewm/runs/pusht_hierarchical_default/pusht_hierarchical_default_epoch_15_object.ckpt
  init_decoder_checkpoint: null
  loss:
    pred_weight: 0.5
  decoder:
    patch_size: 16
    hidden_dim: 256
    depth: 4
    heads: 4
    mlp_ratio: 4.0
    dropout: 0.0
  visualization:
    num_grids: 4
checkpointing:
  bundle_epoch_interval: 1
  resume_from: null
eval:
  decoder_checkpoint_path: null
  split: val
  max_batches: null
  output_subdir: decoder_probe_eval
data:
  dataset:
    num_steps: ${eval:'${wm.history_size} + ${wm.high_level.waypoints.max_span}'}
    frameskip: 5
    name: pusht_expert_train
    keys_to_load:
    - pixels
    - action
    - proprio
    - state
    keys_to_cache:
    - action
    - proprio
    - state
