hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - policy=runs/pusht_hierarchical_default/pusht_hierarchical_default_epoch_15
    - seed=42
    - planning.mode=hierarchical
    - eval.num_eval=4
    - eval.goal_offset_steps=50
    - ~world.history_size
    - ~world.frame_skip
    - eval.eval_budget=10
    - planning.high.solver.num_samples=1500
    - planning.high.solver.n_steps=40
    - planning.high.solver.topk=10
    - planning.low.solver.num_samples=900
    - planning.low.solver.n_steps=30
    - planning.low.solver.topk=150
    - planning.high.plan_config.horizon=2
    - planning.high.plan_config.receding_horizon=1
    - planning.high.plan_config.action_block=1
    - planning.high.replan_interval=5
    - planning.low.plan_config.horizon=2
    - planning.low.plan_config.receding_horizon=1
    - planning.low.plan_config.action_block=5
    - planning.high.solver.device=cuda
    - planning.low.solver.device=cuda
    - solver.device=cuda
    - output.filename=hi_pusht_d50_seed42.txt
    - +output.root_dir=/content/stablewm/our_evals/probe_d50_seed42_n4
  job:
    name: hierarchical
    chdir: null
    override_dirname: +output.root_dir=/content/stablewm/our_evals/probe_d50_seed42_n4,eval.eval_budget=10,eval.goal_offset_steps=50,eval.num_eval=4,output.filename=hi_pusht_d50_seed42.txt,planning.high.plan_config.action_block=1,planning.high.plan_config.horizon=2,planning.high.plan_config.receding_horizon=1,planning.high.replan_interval=5,planning.high.solver.device=cuda,planning.high.solver.n_steps=40,planning.high.solver.num_samples=1500,planning.high.solver.topk=10,planning.low.plan_config.action_block=5,planning.low.plan_config.horizon=2,planning.low.plan_config.receding_horizon=1,planning.low.solver.device=cuda,planning.low.solver.n_steps=30,planning.low.solver.num_samples=900,planning.low.solver.topk=150,planning.mode=hierarchical,policy=runs/pusht_hierarchical_default/pusht_hierarchical_default_epoch_15,seed=42,solver.device=cuda,~world.frame_skip,~world.history_size
    id: ???
    num: ???
    config_name: hi_pusht
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.3'
    cwd: /content/drive/MyDrive/inzva-final/code
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: h_le_wm.config.eval
      schema: pkg
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /content/drive/MyDrive/inzva-final/code/outputs/2026-09-26/16-49-57
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
